name: 블로그 AI 인덱스 업데이트

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 자동 확인 (KST 03:17/09:17/15:17/21:17)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: blog-ai-index-update
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 인덱스 생성 (증분)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/build_index.py \
            --blog https://semicon-circuit.tistory.com \
            --out docs/index.json

      - name: 변경사항 커밋
        run: |
          git config user.name "blog-ai-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update blog AI index"
          git pull --rebase origin main
          git push
